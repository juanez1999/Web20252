<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
</head>
<body>
    <h1>Encuentra la palabra oculta</h1>
    <p class="wordDisplay"></p>
    <input type="text" maxlength="1" class="inputBox">
    <button class="send">Send</button>
    <p class="info">Intentos fallidos:</p>
    <p class="message"></p>

    <script>
        const words = ['gato','perro','capibara']
        const randomNumber = Math.floor(Math.random() * words.length);
        const selectedWord = words[randomNumber];

        let mistakes = 0;
        const displayWord = document.querySelector('.wordDisplay');

        const wordArray = selectedWord.split(''); //Este es la bobada
        const hideWords = Array(wordArray.length).fill('_');
        displayWord.textContent = hideWords; //La copia se muestra en pantalla siempre

        const checkLetter = () => {
            const input = document.querySelector('.inputBox');
            const valueInput = input.value;
            
            // wordArray.forEach((element) => {
            //     if(element === valueInput){
            //         wordArray.forEach((char,index) => {
            //             if(char === valueInput){
            //                 hideWords[index] = valueInput;
            //             }
            //         });
            //     }
            // })

            //Arreglo ['g','a','t','o']
            if(wordArray.includes(valueInput)){
                wordArray.forEach((char,index) => {
                    if(char === valueInput){
                        hideWords[index] = valueInput;
                    }
                });
            }else{
                mistakes++;
            }

             displayWord.textContent = hideWords;
            
            
        }
        const button = document.querySelector('.send');
        button.addEventListener('click',()=> checkLetter());

    </script>
</body>
</html>
